<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메신저</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="bar">
    <button id="back" class="icon" type="button" aria-label="목록으로" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="title" class="title">메시지</h1>
    <span id="dots" class="dots"></span>
    <button id="refresh" class="icon" type="button" aria-label="새로고침">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div id="banners" class="banners"></div>

  <nav id="chips" class="chips" aria-label="메신저 필터" hidden></nav>

  <main id="list" class="list" tabindex="-1"></main>

  <main id="convo" class="convo" tabindex="-1" hidden></main>

  <script src="panel.js"></script>
</body>
</html>
